services:
  backend:
    build: ./backend
    environment:
      DATABASE_PATH: /app/data/elo_ratings.db
    volumes:
      - ./data:/app/data
    # Not published to the host: the frontend proxies /api to it over the compose network.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "${ELO_BIND:-0.0.0.0}:${ELO_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    hostname: ${TS_HOSTNAME:-elo}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # Without this, containerboot logs in again on every start, which fails once a
      # single-use auth key has been consumed.
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  tailscale-state:
