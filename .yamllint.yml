extends: default

ignore-from-file: .gitignore

rules:
  line-length:
    max: 120
  comments:
    min-spaces-from-content: 1
  document-start: disable
  truthy:
    allowed-values: ['true', 'false']
    # GitHub Actions uses the bare key "on", which YAML 1.1 reads as a boolean.
    check-keys: false
