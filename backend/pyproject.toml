# Tool settings for the backend. Runtime dependencies are pinned in
# requirements.txt and test tools in requirements-dev.txt.

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = [
    "config",
    "db",
    "elo",
    "main",
    "migrations",
    "queries",
    "routers",
    "schemas",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B608 flags every f-string that contains SQL. Here those only splice in constant
# column lists and "?" placeholders; values are always bound parameters.
skips = ["B608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
filterwarnings = [
    # httpx is pinned by the project; Starlette now prefers httpx2 for TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
