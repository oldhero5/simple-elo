# Repository tooling only (pre-commit and detect-secrets); this is not an
# installable package. The backend's dependencies are pinned in
# backend/requirements.txt and backend/requirements-dev.txt, and its tool
# settings (black, isort, bandit, pytest) live in backend/pyproject.toml.
[project]
name = "simple-elo"
version = "2.0.0"
description = "Pairwise Elo ratings for a team."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    # Same version as the detect-secrets hook, so the baseline format matches.
    "detect-secrets==1.5.0",
]

[tool.uv]
package = false
