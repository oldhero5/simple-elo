[project]
name = "simple-elo"
version = "0.1.0"
description = "Military-grade performance rating system using ELO algorithms"
authors = [
    { name = "ELO Performance Rater Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pre-commit>=3.5.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "bandit>=1.7.5",
    "safety>=2.3.4",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests"]
