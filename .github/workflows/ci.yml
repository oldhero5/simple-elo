name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements-dev.txt
      - run: flake8 --max-line-length=88 --extend-ignore=E203,W503 --exclude=.venv .
      # tests/test_seed.py skips here: it needs the simulation's E_*.csv
      # files, which are not in the repo. Seeding is tested locally only.
      - run: python -m pytest tests -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Host allowlist, cross-site write, body-size and body-time guards
      # against the real server. No backend is needed: every refusal happens
      # before the proxy calls it. The extra hosts stand in for a tailnet IP
      # and MagicDNS name; each run also checks unlisted names are refused.
      - name: Check request guards
        env:
          ALLOWED_HOSTS: ci-mac.tailnet.example,100.64.0.1
          BODY_READ_TIMEOUT_MS: "3000"
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          EXTRA_HOST=ci-mac.tailnet.example:3000 node scripts/check-proxy.mjs || { cat next.log; exit 1; }
          EXTRA_HOST=100.64.0.1:3000 node scripts/check-proxy.mjs || { cat next.log; exit 1; }
