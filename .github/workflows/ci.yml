name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements-dev.txt
      - run: flake8 --max-line-length=88 --extend-ignore=E203,W503 --exclude=.venv .
      # tests/test_seed.py skips here: it needs the simulation's E_*.csv
      # files, which are not in the repo. Seeding is tested locally only.
      - run: python -m pytest tests -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Host allowlist, cross-site write, body-size, body-time and socket
      # closing guards against the built server. The script starts its own
      # stub backend and next start on free loopback ports.
      - name: Check request guards
        run: node scripts/check-proxy.mjs
